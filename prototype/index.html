<title>작은 도서관 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 휴대폰에서는 앱 화면이 꽉 차고, 넓은 화면에서는 가운데 폰 틀 + 오른쪽 기획 메모.
   색·크기는 앱 설계(specs/astra-reading/design.md §2, §1-5)의 토큰을 그대로 쓴다. */
:root{
  --bg:#FFF9F0; --surface:#FFFEFA; --ink:#282B3A; --ink2:#626477;
  --primary:#6350A0; --on-primary:#FFFFFF; --peach:#EDC9B7; --sage:#C5D4C0;
  --welcome-a:#FFE9DB; --welcome-b:#FFF5DE; --list-a:#E6F3E9; --list-b:#F5F1DF;
  --pub:#DBEEE3; --pub-ink:#284E40; --line:#ECE3D6; --chip:#F3ECFF;
  --frame:#E9E1D3; --note-bg:#FFFFFF; --ok:#2F7D4F; --warn:#9A6400; --todo:#7A7F91;
  --shadow:0 2px 10px rgba(40,43,58,.07);
  --font:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --font-ui:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191D2B; --surface:#252B3D; --ink:#F6F1E7; --ink2:#B9BFCE; --primary:#D1C2FF; --on-primary:#241B3D;
  --peach:#7A5E54; --sage:#56685A; --welcome-a:#34304A; --welcome-b:#2E3048; --list-a:#293C40; --list-b:#2A3340;
  --pub:#284E40; --pub-ink:#DBEEE3; --line:#343A50; --chip:#34304A; --frame:#10131D; --note-bg:#20253A;
  --ok:#7FD3A0; --warn:#F0C066; --todo:#9AA0B2; --shadow:0 2px 10px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191D2B; --surface:#252B3D; --ink:#F6F1E7; --ink2:#B9BFCE; --primary:#D1C2FF; --on-primary:#241B3D;
  --peach:#7A5E54; --sage:#56685A; --welcome-a:#34304A; --welcome-b:#2E3048; --list-a:#293C40; --list-b:#2A3340;
  --pub:#284E40; --pub-ink:#DBEEE3; --line:#343A50; --chip:#34304A; --frame:#10131D; --note-bg:#20253A;
  --ok:#7FD3A0; --warn:#F0C066; --todo:#9AA0B2; --shadow:0 2px 10px rgba(0,0,0,.3); color-scheme:dark}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--frame);color:var(--ink);font-family:var(--font-ui);font-size:15px;margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:12px}
.stage{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phone{width:390px;max-width:100%;height:min(820px,calc(100vh - 48px));background:var(--bg);border-radius:36px;
  box-shadow:0 20px 60px rgba(0,0,0,.18);position:relative;overflow:hidden;display:flex;flex-direction:column;border:8px solid #1d1f27}
.notes{width:330px;flex:none;position:sticky;top:24px;display:flex;flex-direction:column;gap:12px}
@media (max-width:820px){
  .stage{padding:0;display:block;height:100%}
  .phone{width:100%;height:100%;border-radius:0;border:0;box-shadow:none}
  .notes{position:fixed;inset:auto 0 0 0;width:auto;z-index:50;background:var(--note-bg);border-radius:22px 22px 0 0;
    padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    box-shadow:0 -6px 30px rgba(0,0,0,.25);max-height:70%;overflow:auto}
  .notes[hidden]{display:none!important}
}
.note-card{background:var(--note-bg);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.note-card h2{margin:0 0 6px;font-size:16px}
.note-card p{margin:0 0 8px;color:var(--ink2);line-height:1.55;font-size:14px}
.note-card ul{margin:0;padding-left:18px;line-height:1.6;font-size:14px}
.st{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;margin-right:4px;letter-spacing:.02em}
.st.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.st.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.st.todo{color:var(--todo);background:color-mix(in srgb,var(--todo) 16%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--ink2)}
.notes .note-toggle,.appbar .note-toggle{display:none}
@media (max-width:820px){.notes .note-toggle,.appbar .note-toggle{display:flex}}

/* ── 앱 화면 ── */
.appbar{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.appbar h1{font-family:var(--font);font-size:24px;margin:0;flex:1;font-weight:400}
.icon-btn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;font-size:22px}
.icon-btn:hover{background:var(--chip)}
.screen{flex:1;overflow:auto;padding:4px 16px 150px}
.welcome{border-radius:30px;padding:18px;display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--welcome-a),var(--welcome-b))}
.welcome.list{background:linear-gradient(135deg,var(--list-a),var(--list-b))}
.welcome h2{font-family:var(--font);font-size:22px;line-height:1.35;margin:0 0 4px;font-weight:400;white-space:pre-line}
.welcome p{margin:0;color:var(--ink2);font-size:14px}
.buddy{width:72px;height:72px;flex:none;cursor:pointer}
.buddy.wave{animation:wave .7s ease-out 1}
@keyframes wave{30%{transform:rotate(-10deg) translateY(-4px)}60%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.buddy.wave{animation:none}}
.search{margin:14px 0 10px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:0 14px;height:48px}
.search input{border:0;background:transparent;flex:1;font:inherit;color:var(--ink);font-size:16px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.chip[aria-pressed="true"]{background:var(--pub);color:var(--pub-ink);border-color:transparent;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:22px;font-weight:700}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.soft{background:var(--chip)}
.btn.big{min-height:56px;width:100%;font-size:17px}
.row-actions{display:flex;gap:8px;margin:12px 0}
.pub{margin-top:14px}
.pub-h{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
.pub-h small{color:var(--ink2);font-weight:400}
.series{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.series-h{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;text-align:left}
.series-h .t{flex:1;font-weight:700}
.series-h .c{color:var(--ink2);font-size:14px}
.series-body{padding:0 12px 12px}
.book{display:flex;align-items:center;gap:12px;padding:8px 4px;border-top:1px solid var(--line)}
.cover{width:46px;height:58px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:#3B3550;position:relative;overflow:hidden}
.book .meta{flex:1;min-width:0}
.book .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book .meta span{color:var(--ink2);font-size:13px}
.tracks{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.tk{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--ink2)}
.play-sm{width:44px;height:44px;border-radius:22px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:18px;flex:none}
.more{width:36px;height:44px;font-size:20px;color:var(--ink2)}
.tabbar{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:12px;color:var(--ink2)}
.tab .i{font-size:22px;height:30px;width:56px;display:grid;place-items:center;border-radius:15px;transition:background .28s}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700}
.tab[aria-selected="true"] .i{background:var(--chip)}
.mini{position:absolute;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--surface);border-radius:24px;box-shadow:0 6px 24px rgba(40,43,58,.18);display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;z-index:6}
.mini .cover{width:40px;height:48px}
.mini .meta{flex:1;min-width:0;text-align:left}
.mini .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .meta span{font-size:13px;color:var(--ink2)}
.mini .bar{position:absolute;left:18px;right:18px;bottom:4px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.mini .bar i{display:block;height:100%;background:var(--primary);width:0}
.list-card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:14px 16px;margin-top:10px;display:flex;align-items:center;gap:12px}
.list-card .meta{flex:1;min-width:0}
.list-card .meta span{color:var(--ink2);font-size:13px}
.stack{display:flex;flex:none;min-width:max-content}
.stack .cover{width:34px;height:44px;margin-left:-12px;border:2px solid var(--surface)}
.stack .cover:first-child{margin-left:0}
.section-t{font-family:var(--font);font-size:20px;margin:18px 0 8px;font-weight:400}
.q-item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border-radius:20px;margin-bottom:8px}
.q-item.now{outline:2px solid var(--primary)}
.q-item .h{color:var(--ink2);font-size:20px}
.set-card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:16px;margin-top:12px}
.set-card h3{margin:0 0 4px;font-size:16px}
.set-card p{margin:0 0 10px;color:var(--ink2);font-size:14px;line-height:1.5}
.set-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .t{flex:1}
.set-row small{display:block;color:var(--ink2);font-size:13px}
.warnbox{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--ink);border-radius:16px;padding:10px 12px;font-size:13px;line-height:1.5;margin-top:8px}
.sheet-bg{position:absolute;inset:0;background:rgba(20,22,30,.4);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 8px;font-size:17px}
.sheet .opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 6px;border-radius:14px;font-size:16px}
.sheet .opt:hover{background:var(--chip)}
.full{position:absolute;inset:0;background:var(--bg);z-index:15;display:flex;flex-direction:column}
.form{display:flex;flex-direction:column;gap:12px}
.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.field input{width:100%;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font:inherit;font-size:16px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 110px;gap:10px}
.cover-slot{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:24px;padding:12px}
.cover-slot .cover{width:64px;height:82px}
.pages{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pg{background:var(--surface);border-radius:18px;padding:8px;box-shadow:var(--shadow)}
.spread{aspect-ratio:4/3;max-width:100%;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.spread i{display:block}
.pg span{display:block;font-size:13px;color:var(--ink2);margin-top:6px}
.saving{font-size:13px;color:var(--ink2);text-align:right}
.voice-pg{background:var(--surface);border-radius:24px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.voice-pg .top{display:flex;gap:12px;align-items:center}
.voice-pg .spread{width:110px;flex:none}
.rec{width:56px;height:56px;border-radius:28px;background:#C2453D;color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.rec.on{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(194,69,61,.25)}}
@media (prefers-reduced-motion:reduce){.rec.on{animation:none}}
.textarea{width:100%;min-height:60px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:10px;font:inherit;color:var(--ink);margin-top:10px;resize:vertical}
.reader{flex:1;display:flex;flex-direction:column;padding:0 16px 16px;gap:14px}
.reader .spread{width:100%;border-radius:20px;box-shadow:var(--shadow)}
.reader .text{font-family:var(--font);font-size:20px;line-height:1.6;min-height:64px;text-align:center}
.ctrl{display:flex;align-items:center;justify-content:center;gap:18px}
.ctrl .main{width:76px;height:76px;border-radius:38px;background:var(--primary);color:var(--on-primary);font-size:30px;display:grid;place-items:center}
.ctrl .side{width:56px;height:56px;border-radius:28px;background:var(--chip);font-size:22px;display:grid;place-items:center}
.srcs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.srcs .chip[disabled]{opacity:.45;cursor:not-allowed}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--primary);width:20px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:170px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:16px;font-size:14px;z-index:40;max-width:86%;text-align:center}
.camera{position:absolute;inset:0;background:#0d0e12;color:#fff;z-index:30;display:flex;flex-direction:column}
.camera .view{flex:1;margin:16px;border:2px dashed rgba(255,255,255,.5);border-radius:18px;display:grid;place-items:center;text-align:center;color:rgba(255,255,255,.8);padding:16px}
.camera .bar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px calc(24px + env(safe-area-inset-bottom,0px))}
.shutter{width:72px;height:72px;border-radius:36px;background:#fff;border:6px solid rgba(255,255,255,.4);background-clip:padding-box}
.empty{color:var(--ink2);text-align:center;padding:30px 10px;line-height:1.6}
.mode-btn{display:inline-flex;align-items:center;gap:4px;font-family:var(--font);font-size:24px;padding:4px 8px;margin-left:-8px;border-radius:14px}
.mode-btn:hover{background:var(--chip)}
.mode-btn small{font-size:14px;color:var(--ink2)}
.week{border-radius:24px;padding:16px;background:linear-gradient(135deg,var(--welcome-a),var(--list-a));margin-top:12px}
.week h3{margin:2px 0 4px;font-family:var(--font);font-weight:400;font-size:21px}
.week p{margin:0 0 8px;color:var(--ink2);font-size:14px}
.week .eyebrow{font-size:12px;letter-spacing:.04em;color:var(--ink2);font-weight:700}
.plan-m{background:var(--surface);border-radius:20px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.plan-m.now{outline:2px solid var(--primary)}
.plan-m b{display:block;margin-bottom:4px}
.plan-m ol{margin:0;padding-left:20px;color:var(--ink2);font-size:14px;line-height:1.6}
.plan-m li.now{color:var(--ink);font-weight:700}
.notif{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:45;background:var(--surface);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;text-align:left;width:auto}
.notif small{display:block;color:var(--ink2);font-size:12px}
.big-cover{width:min(70%,260px);aspect-ratio:1;max-width:100%;margin:0 auto;border-radius:28px;display:grid;place-items:center;font-size:64px;box-shadow:var(--shadow)}
.topic{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--pub);color:var(--pub-ink);font-weight:700}
.chips.sub{margin-top:2px}
.chips.sub .chip{height:32px;font-size:13px}
.chip-lbl{flex:none;align-self:center;font-size:12px;color:var(--ink2);margin-right:2px}
/* 태블릿 · TV 미리보기: 넓은 화면에서 폰 틀을 가로 화면으로 바꾼다 */
.phone.tablet{width:900px;height:min(600px,calc(100vh - 48px));border-radius:28px}
.phone.tv{width:1000px;height:min(562px,calc(100vh - 48px));border-radius:10px;border-width:14px}
@media (max-width:820px){.phone.tablet,.phone.tv{width:100%;height:100%;border-radius:0;border-width:0}}
.devsw{display:flex;gap:6px}
.devsw .chip{flex:1}
.watch{position:absolute;inset:0;background:#0f1118;color:#F6F1E7;z-index:25;display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.watch .wtop{display:flex;align-items:center;gap:8px;min-height:48px}
.watch .wtop b{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watch .wbtn{min-width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.12);color:#fff;font-size:20px;display:grid;place-items:center;padding:0 12px}
.watch .wbtn[aria-pressed="true"]{background:#D1C2FF;color:#241B3D}
.watch .wstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:18px;position:relative;container-type:size}
.watch .wstage .spread{width:min(100cqw,133cqh);height:auto;aspect-ratio:4/3;border-radius:18px}
.watch .sub{text-align:center;font-family:var(--font);font-size:clamp(20px,3.2vw,34px);line-height:1.4;padding:10px 8px;min-height:2.6em;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.watch .wbar{height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.watch .wbar i{display:block;height:100%;background:#D1C2FF}
.watch .wctrl{display:flex;justify-content:center;gap:18px;padding-top:10px}
.watch .wctrl button{width:64px;height:64px;border-radius:32px;background:rgba(255,255,255,.14);color:#fff;font-size:26px}
.watch.locked .wctrl,.watch.locked .wtop .hide-lock{visibility:hidden}
.lockhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);padding:14px 18px;border-radius:16px;text-align:center;font-size:15px;line-height:1.5;z-index:3}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;left:0;bottom:0;height:4px;background:#D1C2FF;width:0}
.hold.on i{width:100%;transition:width 1.5s linear}
/* AI 움직이는 그림 흉내: 천천히 확대·이동 + 떠다니는 빛. 실제 AI 영상 아님 */
.alive .spread{animation:kb 8s ease-in-out infinite alternate}
.alive::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.35) 0 6px,transparent 7px),radial-gradient(circle at 70% 25%,rgba(255,255,255,.3) 0 4px,transparent 5px),radial-gradient(circle at 55% 70%,rgba(255,255,255,.25) 0 5px,transparent 6px);animation:float 4s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-2%,-1%)}}
@keyframes float{to{transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.alive .spread,.alive::after{animation:none}}
.ai-tag{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:4px 10px;border-radius:99px;z-index:2}
</style>

function topicChips(){
  // 1줄: 큰 주제. 고른 주제에 아래 주제가 있으면 2줄에 펼친다.
  const roots=Object.keys(TOPICS).filter(k=>!TOPICS[k].p);
  const path=S.topic?tpath(S.topic):[];
  const rows=[roots];
  path.forEach(t=>{const kids=Object.keys(TOPICS).filter(k=>TOPICS[k].p===t);if(kids.length)rows.push(kids)});
  return rows.map((r,i)=>`<div class="chips ${i?"sub":""}" role="group" aria-label="주제 ${i+1}단계">${i===0?`<span class="chip-lbl">주제</span><button class="chip" aria-pressed="${!S.topic}" data-act="topicset" data-v="">전체</button>`:""}${r.map(k=>`<button class="chip" aria-pressed="${path.includes(k)}" data-act="topicset" data-v="${k}">${TOPICS[k].e} ${esc(TOPICS[k].n)}</button>`).join("")}</div>`).join("");
}

    <h2 class="section-t" style="margin-bottom:0">내용 ${d.pages}쪽</h2>

      :`<p style="color:var(--ink2);margin:0">책을 펼쳐 내용을 촬영해 주세요. 사진만으로도 책을 저장할 수 있어요.</p>`}
    <button class="btn primary big" data-act="cam" data-v="page">📷 내용 연속 촬영</button>
  </div></div>`;
}
function voice(){
  const b=book(S.voiceBook);
  return `<div class="appbar"><button class="icon-btn" data-act="close" aria-label="뒤로">←</button><h1>목소리 넣기</h1><button class="btn primary" data-act="voicesave">저장</button></div>
  <div class="screen" style="padding-bottom:30px"><p style="margin:0 0 12px;color:var(--ink2)">${esc(b.title)} · 페이지마다 직접 읽어 녹음하거나 글을 넣어 기기로 읽혀요.</p>
  ${b.pages.map((t,i)=>{const r=S.rec[b.id+"-"+i]||(b.tracks.includes("녹음")?"done":"");return `<div class="voice-pg"><div class="top">${spread(b,i)}
    <div style="flex:1"><b>${i+1}쪽</b><br><span style="font-size:13px;color:var(--ink2)">${r==="done"?"🎙 녹음이 있어요":r==="on"?"녹음 중… 다시 누르면 마쳐요":"목소리를 담아 주세요"}</span></div>
    <button class="rec ${r==="on"?"on":""}" data-act="rec" data-v="${i}" aria-label="${i+1}쪽 ${r==="on"?"녹음 마치기":"녹음"}">${r==="on"?"■":"●"}</button></div>
    <textarea class="textarea" aria-label="${i+1}쪽 읽어줄 글" placeholder="읽어줄 글 (직접 녹음은 생략 가능)">${esc(t)}</textarea>
    <div class="row-actions" style="margin-bottom:0"><button class="btn soft" data-act="speak" data-v="${esc(t)}">▶ 들어보기</button><button class="btn soft" data-act="speak" data-v="${esc(t)}">🔊 기기 읽기 사용</button></div></div>`}).join("")}
  </div>`;
}
function reader(){
  const b=book(S.queue[S.qi]); if(!b) return "";
  const has=b.tracks;
  return `<div class="appbar"><button class="icon-btn" data-act="close" aria-label="닫기">⌄</button><h1 style="font-size:20px">${esc(b.title)}</h1><button class="icon-btn" data-act="watch" aria-label="영상처럼 보기">📺</button><button class="icon-btn" data-act="queuepage" aria-label="최근재생목록">≡</button></div>
  <div class="reader">${kind(b)==="music"?`<div class="big-cover" style="background:linear-gradient(160deg,${PAL[b.c%PAL.length][0]},${PAL[b.c%PAL.length][1]})" aria-hidden="true">🎵</div>`:`<div style="position:relative;overflow:hidden;border-radius:20px" class="${S.alive||kind(b)==="video"?"alive":""}">${spread(b,S.page)}${kind(b)==="video"?`<span class="ai-tag">🎬 영상 (예시)</span>`:""}`}${S.alive&&kind(b)==="book"?`<span class="ai-tag">✨ 움직이는 그림 (예시)</span>`:""}${kind(b)==="music"?"":"</div>"}
    <div class="text">${esc(b.pages[S.page])}</div>
    <div class="dots">${b.pages.map((_,i)=>`<i class="${i===S.page?"on":""}"></i>`).join("")}</div>
    ${kind(b)==="book"?`<div class="srcs"><button class="chip" aria-pressed="${S.alive}" data-act="alive">✨ 움직이는 그림 ${S.alive?"켜짐":"(예시)"}</button></div>`:""}
    <div class="srcs" role="group" aria-label="목소리 고르기">${["녹음","기기 읽기","AI 목소리"].map(s=>`<button class="chip" aria-pressed="${S.src===s}" data-act="src" data-v="${s}" ${s==="AI 목소리"||!has.includes(s)?"disabled":""}>${s==="녹음"?"🎙 부모 녹음":s==="기기 읽기"?"🔊 기기 읽기":"✨ AI 목소리 (준비 중)"}</button>`).join("")}</div>
    <div class="ctrl"><button class="side" data-act="prev" aria-label="앞 페이지">⏮</button>
      <button class="main" data-act="pp" aria-label="${S.playing?"일시정지":"재생"}">${S.playing?"❚❚":"▶"}</button>
      <button class="side" data-act="next" aria-label="다음 페이지">⏭</button></div>
    <p style="text-align:center;color:var(--ink2);font-size:13px;margin:0">${S.page+1} / ${b.pages.length}쪽 · 다 읽으면 다음 책으로 넘어가요</p>
  </div>`;
}

function render(){
  const ph=$("#phone");ph.className="phone"+(S.dev!=="phone"?" "+S.dev:"");const titles={settings:"설정"};
  const body={shelf,lists,curate,settings}[S.tab]();
  const b=book(S.queue[S.qi]);
  ph.innerHTML=`
   <div class="appbar"><h1>${S.tab==="settings"?titles[S.tab]:`<button class="mode-btn" data-act="mode" aria-label="${MODES[S.mode].n}, 다른 방 고르기">${MODES[S.mode].n} <small>▾</small></button>`}</h1>
     <button class="icon-btn note-toggle" data-act="notes" aria-label="기획 메모 보기">📒</button>
     ${S.tab==="shelf"?`<button class="icon-btn" data-act="${S.mode==="book"?"new":"addmedia"}" aria-label="${MODES[S.mode].add}" style="background:var(--primary);color:var(--on-primary)">＋</button>`:""}</div>
   <div class="screen" id="scr">${body}</div>
   ${b&&S.queue.length?`<button class="mini" data-act="reader" aria-label="플로팅 플레이어 펼치기">${cover(b)}
     <div class="meta"><b>${esc(b.title)}</b><span>${S.page+1} / ${b.pages.length}${kind(b)=="book"?"쪽":""} · ${S.playing?"재생 중":"눌러서 이어 듣기"}</span></div>
     <span class="play-sm" data-act="pp" role="button" aria-label="${S.playing?"일시정지":"재생"}">${S.playing?"❚❚":"▶"}</span>
     <span class="bar"><i style="width:${S.prog}%"></i></span></button>`:""}
   <nav class="tabbar" role="tablist">${[["shelf",MODES[S.mode].e,MODES[S.mode].shelf],["lists","🎵","플레이리스트"],["curate","🧺","모아보기"],["settings","⚙️","설정"]].map(([k,i,l])=>`
     <button class="tab" role="tab" aria-selected="${S.tab===k}" data-act="tab" data-v="${k}"><span class="i">${i}</span>${l}</button>`).join("")}</nav>
   ${S.overlay?`<div class="full">${{author,voice,reader,watch,col,queuePage,plan}[S.overlay]()}</div>`:""}
   ${S.sheet||""}
   ${S.notif?`<button class="notif" data-act="notifopen"><span style="font-size:22px">🔔</span><span><b>이번 주 누리과정 · 겨울 준비하는 동물</b><small>작은 도서관 · 지금</small>우리 책장에 맞는 책 ${DB.books.filter(COLS[0].f).length}권이 있어요. 눌러서 들어요</span></button>`:""}`;
  renderNotes();
  const q=$("#q"); if(q){q.oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)}}
  ph.querySelectorAll("[data-in]").forEach(el=>el.oninput=e=>{S.draft[el.dataset.in]=e.target.value;S.draft.saved=false;$(".saving").textContent="저장하는 중…";clearTimeout(S.t9);S.t9=setTimeout(()=>{S.draft.saved=true;const s=$(".saving");if(s)s.textContent="✓ 작성 내용이 자동 보관돼요"},900)});
}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;$("#phone").appendChild(t);setTimeout(()=>t.remove(),2200)}
function sheet(h){S.sheet=`<div class="sheet-bg" data-act="unsheet"><div class="sheet" data-stop="1"><div class="grab"></div>${h}</div></div>`;render()}

// 재생 흉내: 페이지마다 4초. 기기 읽기는 브라우저 음성으로 시도하고 안 되면 조용히 넘어간다.
let timer=null;
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function startPlay(){S.playing=true;clearInterval(timer);const b=book(S.queue[S.qi]);if(S.src==="기기 읽기")speak(b.pages[S.page]);
  timer=setInterval(()=>{S.prog+=5;if(S.prog>=100){S.prog=0;const b=book(S.queue[S.qi]);
    if(S.page<b.pages.length-1)S.page++;else if(S.qi<S.queue.length-1){S.qi++;S.page=0;pickSrc()}else{S.playing=false;clearInterval(timer)}
    if(S.playing&&S.src==="기기 읽기")speak(book(S.queue[S.qi]).pages[S.page])}render()},200)}
function stopPlay(){S.playing=false;clearInterval(timer);try{speechSynthesis.cancel()}catch(e){}}
function pickSrc(){const b=book(S.queue[S.qi]);S.src=b.tracks[0]||"기기 읽기"}
function playIds(ids){S.queue=ids.filter(i=>book(i).pages.length);S.qi=0;S.page=0;S.prog=0;pickSrc();startPlay();S.overlay="reader";render()}

document.addEventListener("click",e=>{
  if(e.target.closest("[data-hold]"))return;
  const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.dataset.act==="unsheet"&&e.target.closest("[data-stop]"))return;
  e.stopPropagation(); const v=el.dataset.v, a=el.dataset.act;
  switch(a){
    case"tab":S.tab=v;S.overlay=null;break;
    case"pub":S.pub=v;break;
    case"toggle":S.open[v]=S.open[v]===false;break;
    case"wave":el.classList.remove("wave");void el.getBoundingClientRect();el.classList.add("wave");return;
    case"play":playIds([+v]);return;
    case"playall":playIds(M().map(b=>b.id));return;
    case"playseries":playIds(DB.books.filter(b=>b.series===v).sort((a,b)=>a.no-b.no).map(b=>b.id));return;
    case"playlist":playIds(DB.lists.find(l=>l.id==v).ids);return;
    case"reader":S.overlay="reader";break;
    case"pp":if(S.overlay==="watch"&&S.watchLock)return;S.playing?stopPlay():startPlay();break;
    case"next":{const b=book(S.queue[S.qi]);S.prog=0;if(S.page<b.pages.length-1)S.page++;if(S.playing)startPlay();break}
    case"prev":S.prog=0;if(S.page>0)S.page--;if(S.playing)startPlay();break;
    case"src":S.src=v;if(S.playing)startPlay();break;
    case"topicset":S.topic=v||null;break;
    case"fav":{const b=book(+v);b.fav=!b.fav;toast(b.fav?"즐겨찾기에 넣었어요":"즐겨찾기에서 뺐어요");break}
    case"col":S.col=v;S.overlay="col";break;
    case"colplay":{const ids=M().filter(COLS.find(c=>c.id===v).f).map(b=>b.id);if(!ids.length){toast("아직 책이 없어요");return}playIds(ids);return}
    case"colwatch":{const ids=M().filter(COLS.find(c=>c.id===v).f).map(b=>b.id);if(!ids.length){toast("아직 책이 없어요");return}playIds(ids);S.overlay="watch";render();return}
    case"queuepage":S.overlay="queuePage";break;
    case"mode":sheet(`<h3>어느 방으로 갈까요?</h3>${Object.entries(MODES).map(([k,m])=>`<button class="opt" data-act="setmode" data-v="${k}" aria-pressed="${S.mode===k}">${m.e} ${m.n} <span style="margin-left:auto;color:var(--ink2);font-size:14px">${DB.books.filter(b=>kind(b)===k).length}${m.unit}${S.mode===k?" · 지금":""}</span></button>`).join("")}
      <p style="color:var(--ink2);font-size:13px;margin:8px 6px 0">책장 · 플레이리스트 · 모아보기가 고른 방의 것으로 바뀌어요. 듣던 것은 계속 들려요.</p>`);return;
    case"setmode":S.mode=v;S.sheet=null;S.pub="전체";S.topic=null;S.q="";break;
    case"addmedia":toast(S.mode==="music"?"노래를 녹음하거나 파일을 가져와요 (예시)":"폰 앨범에서 영상을 가져와요 (예시)");return;
    case"plan":S.overlay="plan";break;
    case"alarm":S.nuriAlarm=!S.nuriAlarm;break;
    case"notifdemo":S.overlay=null;S.notif=true;render();clearTimeout(S.nt);S.nt=setTimeout(()=>{S.notif=false;render()},6000);return;
    case"notifopen":S.notif=false;S.mode="book";S.tab="curate";S.overlay=null;break;
    case"topic":{const p=tpath(v);sheet(`<h3>${TOPICS[v].e} ${esc(TOPICS[v].n)}</h3><p style="color:var(--ink2);margin:0 0 12px">${esc(p.map(t=>TOPICS[t].n).join(" › "))}</p>
      <button class="opt" data-act="topicgo" data-v="${v}">📚 이 주제 책 보기 (${DB.books.filter(b=>inTopic(b,v)).length}권)</button>
      ${p.length>1?`<button class="opt" data-act="topicgo" data-v="${p[0]}">${TOPICS[p[0]].e} ${esc(TOPICS[p[0]].n)} 전체 보기 (${DB.books.filter(b=>inTopic(b,p[0])).length}권)</button>`:""}`);return}
    case"topicgo":S.topic=v;S.sheet=null;S.tab="shelf";S.overlay=null;break;
    case"watch":S.overlay="watch";S.lockHint=false;if(!S.playing)startPlay();break;
    case"watchlist":playIds(DB.lists.find(l=>l.id==v).ids);S.overlay="watch";render();return;
    case"watchclose":S.overlay="reader";S.watchLock=false;break;
    case"watchtap":if(S.watchLock){S.lockHint=true;render();clearTimeout(S.lh);S.lh=setTimeout(()=>{S.lockHint=false;render()},1800)}return;
    case"alive":S.alive=!S.alive;break;
    case"dev":S.dev=v;if(v!=="phone"&&S.queue.length){S.overlay="watch";if(!S.playing)startPlay()}break;
    case"close":if(S.overlay==="author"||S.overlay==="voice")stopPlay();S.overlay=null;break;
    case"qplay":S.qi=+v;S.page=0;S.prog=0;pickSrc();startPlay();S.overlay="reader";break;
    case"qremove":S.queue.splice(+v,1);if(S.qi>=S.queue.length)S.qi=Math.max(0,S.queue.length-1);if(!S.queue.length)stopPlay();break;
    case"qclear":S.queue=[];stopPlay();break;
    case"new":stopPlay();S.draft={title:"",pub:"",series:"",no:"",cover:false,pages:0,saved:true};S.overlay="author";break;
    case"cam":S.sheet=`<div class="camera"><div class="view">${v==="cover"?"표지를 네모 안에 맞춰 주세요":"책을 가로로 펼쳐 양쪽 면이 다 보이게 찍어 주세요<br><br>찍은 뒤 자르기 · 밝기 보정을 하고 이어서 찍어요"}</div>
      <div class="bar"><button class="btn" style="color:#fff" data-act="unsheet">완료</button><button class="shutter" data-act="shot" data-v="${v}" aria-label="촬영"></button><span style="width:60px;text-align:right">${v==="page"?S.draft.pages+"장":""}</span></div></div>`;break;
    case"shot":if(v==="cover"){S.draft.cover=true;S.sheet=null}else{S.draft.pages++;S.sheet=S.sheet.replace(/\d+장/,S.draft.pages+"장")}render();toast(v==="cover"?"표지를 담았어요":"한 장 보관했어요");return;
    case"save":{const d=S.draft;if(!d.series||!(+d.no>=1)){toast("전집과 1 이상의 책 번호를 넣어 주세요");return}
      if(!d.pages){toast("내용 사진을 한 장 이상 찍어 주세요");return}
      DB.books.push({id:Date.now(),pub:d.pub,series:d.series,no:+d.no,title:d.title||"제목 없는 책",pages:Array.from({length:d.pages},(_,i)=>`${i+1}쪽 글을 넣어 주세요.`),tracks:[],c:DB.books.length});
      S.open[d.series]=true;S.overlay=null;S.tab="shelf";render();toast("책장에 넣었어요. 메뉴에서 목소리를 넣어 보세요");return}
    case"menu":{const b=book(+v);sheet(`<h3>${esc(b.title)}</h3>
      <button class="opt" data-act="voice" data-v="${b.id}">🎙 목소리 넣기</button>
      <button class="opt" data-act="toast" data-v="책 편집 화면으로 가요 (책 만들기와 같은 화면)">✏️ 책 편집</button>
      <button class="opt" data-act="toast" data-v="플레이리스트에 담았어요 (예시)">🎵 플레이리스트에 담기</button>
      <button class="opt" data-act="toast" data-v="이 책의 사진과 녹음도 삭제돼요. 되돌릴 수 없어요." style="color:#C2453D">🗑 삭제</button>`);return}
    case"voice":stopPlay();S.sheet=null;S.voiceBook=+v;S.overlay="voice";break;
    case"rec":{const k=S.voiceBook+"-"+v;S.rec[k]=S.rec[k]==="on"?"done":"on";if(S.rec[k]==="done")toast("녹음을 마쳤어요.");break}
    case"voicesave":{const b=book(S.voiceBook);if(Object.keys(S.rec).some(k=>k.startsWith(b.id+"-")&&S.rec[k]==="done")&&!b.tracks.includes("녹음"))b.tracks.unshift("녹음");S.overlay=null;render();toast("목소리를 저장했어요");return}
    case"speak":speak(v);toast("기기 목소리로 읽어요 (브라우저 음성으로 흉내)");return;
    case"drafts":sheet(`<h3>만들던 책</h3>${DB.drafts.map(d=>`<button class="opt" data-act="new">📝 ${esc(d.title)} · ${d.pages}쪽 · 이어 만들기</button>`).join("")}
      <p style="color:var(--ink2);font-size:13px;margin:8px 6px 0">버리면 초안 사진과 녹음이 삭제돼요. 책장의 완성된 책은 유지돼요.</p>`);return;
    case"restore":sheet(`<h3>이 백업으로 책장을 바꿀까요?</h3><p style="color:var(--ink2);line-height:1.55;margin:0 0 12px">책 6권 · 플레이리스트 2개 · 만들던 책 1권<br><br>현재 책장과 플레이리스트, 최근재생목록을 백업 내용으로 교체해요. 합쳐지지 않아요.</p>
      <div class="row-actions"><button class="btn soft" data-act="unsheet" style="flex:1">취소</button><button class="btn primary" data-act="toast" data-v="책장을 바꿨어요 (예시)" style="flex:1">책장 교체</button></div>`);return;
    case"unsheet":S.sheet=null;break;
    case"toast":S.sheet=null;render();toast(v);return;
    case"notes":S.notesOpen=!S.notesOpen;renderNotes();return;
  }
  render();
});
let holdT=null;
document.addEventListener("pointerdown",e=>{const h=e.target.closest("[data-hold]");if(!h)return;e.preventDefault();
  if(!S.watchLock){S.watchLock=true;S.lockHint=false;render();return}
  h.classList.add("on");holdT=setTimeout(()=>{S.watchLock=false;S.lockHint=false;render();toast("잠금을 풀었어요")},1500)});
["pointerup","pointerleave","pointercancel"].forEach(t=>document.addEventListener(t,()=>{clearTimeout(holdT);document.querySelectorAll(".hold.on").forEach(x=>x.classList.remove("on"))}));
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("svg[data-act]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
window.matchMedia("(max-width:820px)").addEventListener?.("change",renderNotes);
render();
</script>
